services:
  # Socket Server (Background Worker)
  - type: worker
    name: wise-timer-socket
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: SOCKET_PORT
        value: 9980
      - key: PYTHONUNBUFFERED
        value: "true"

  # Controller Web App
  - type: web
    name: wise-timer-controller
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn controller:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SOCKET_HOST
        value: wise-timer-socket.onrender.com
      - key: SOCKET_PORT
        value: 9980
    healthCheckPath: /

  # Timer Display Web App
  - type: web
    name: wise-timer-display
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn timer_display:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SOCKET_HOST
        value: wise-timer-socket.onrender.com
      - key: SOCKET_PORT
        value: 9980
    healthCheckPath: /