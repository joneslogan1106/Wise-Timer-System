services:
  # Socket Server (Background Worker)
  - type: worker
    name: wise-timer-socket
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: SOCKET_PORT
        value: 9980
      - key: PYTHONUNBUFFERED
        value: "true"
    healthCheckPath: /health  # Optional, if you add a health endpoint

  # Controller Web App
  - type: web
    name: wise-timer-controller
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn controller:app --bind 0.0.0.0:$PORT
    envVars:
      - key: CONTROLLER_PORT
        value: 5000
    healthCheckPath: /

  # Timer Display Web App
  - type: web
    name: wise-timer-display
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn timer_display:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DISPLAY_PORT
        value: 5001
    healthCheckPath: /