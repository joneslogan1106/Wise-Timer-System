<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wise Pumas Football Practice Clock</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicion.ico') }}" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap');

        /* =========================================================
           WISE PUMAS PRACTICE CLOCK
           Visual recreation of the supplied scoreboard design.
           Existing JavaScript IDs are intentionally preserved:
           periodNumber, timerDisplay, nextPeriodTime, statusIndicator
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #061a3a;
            --navy-dark: #020b1b;
            --navy-mid: #0b2b59;
            --blue: #0755a8;
            --blue-light: #176bc7;
            --gold: #f5c400;
            --gold-bright: #ffd21a;
            --white: #f8f9fb;
            --black: #020305;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--white);
            background:
                radial-gradient(circle at 50% 42%, rgba(20, 70, 130, .22), transparent 38%),
                linear-gradient(135deg, #031329 0%, #092a57 45%, #03142d 100%);
            font-family: "Arial Narrow", "Segoe UI", Arial, sans-serif;
        }

        /* Deep textured background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .65;
            background:
                repeating-linear-gradient(
                    115deg,
                    transparent 0 70px,
                    rgba(255,255,255,.018) 71px,
                    transparent 73px 140px
                ),
                repeating-linear-gradient(
                    25deg,
                    transparent 0 120px,
                    rgba(0,0,0,.12) 121px,
                    transparent 124px 230px
                );
        }

        /* Gold/white/blue top stripe */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: 7px;
            z-index: 20;
            background: linear-gradient(
                90deg,
                var(--gold) 0 22%,
                var(--white) 22% 27%,
                var(--blue) 27% 73%,
                var(--white) 73% 78%,
                var(--gold) 78% 100%
            );
            box-shadow: 0 2px 14px rgba(0,0,0,.5);
        }

        .page {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .display-shell {
            width: min(100%, 1536px);
            height: 100%;
            padding: 22px 38px 18px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 12px;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            display: grid;
            grid-template-columns: 250px 1fr 180px;
            align-items: center;
            min-height: 112px;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            left: 22%;
            right: 17%;
            bottom: -4px;
            height: 3px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--gold) 12%,
                var(--gold) 88%,
                transparent
            );
            opacity: .9;
        }

        .logo-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
        }

        .logo-left img {
            width: 225px;
            max-height: 100px;
            object-fit: contain;
            filter:
                drop-shadow(0 5px 4px rgba(0,0,0,.65))
                drop-shadow(0 0 9px rgba(255,210,0,.24));
        }

        .header-center {
            text-align: center;
            min-width: 0;
            padding: 0 12px;
        }

        .school-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 3px;
        }

        .school-line::before,
        .school-line::after {
            content: "";
            width: 74px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold));
            transform: skewX(-24deg);
        }

        .school-line::after {
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .header-center h1 {
            color: var(--white);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(1.65rem, 3vw, 3.2rem);
            line-height: .85;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .12em;
            text-transform: uppercase;
            text-shadow:
                3px 3px 0 rgba(0,0,0,.5),
                0 0 18px rgba(255,255,255,.08);
            white-space: nowrap;
        }

        .header-center .subtitle {
            margin-top: 5px;
            color: #eef2f7;
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-size: clamp(.7rem, 1vw, 1rem);
            font-weight: 600;
            letter-spacing: .22em;
            text-transform: uppercase;
        }

        .header-center .practice-title {
            display: block;
            margin-top: -3px;
            color: var(--gold-bright);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(3.1rem, 6vw, 6.4rem);
            line-height: .82;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .045em;
            text-transform: uppercase;
            transform: scaleX(1.02);
            text-shadow:
                3px 4px 0 #876500,
                0 0 20px rgba(255,210,26,.18);
        }

        .logo-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .logo-right img {
            width: 145px;
            max-height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,.6));
        }

        /* Small P.G.T.A.O badge under the header */
        .pgtao {
            position: absolute;
            left: 50%;
            bottom: -23px;
            transform: translateX(-50%);
            z-index: 4;
            padding: 6px 35px 7px;
            min-width: 245px;
            text-align: center;
            color: var(--white);
            background: linear-gradient(180deg, #12529c, #06306a);
            border: 2px solid var(--gold);
            clip-path: polygon(
                10px 0, calc(100% - 10px) 0,
                100% 50%, calc(100% - 10px) 100%,
                10px 100%, 0 50%
            );
            font-size: clamp(.95rem, 1.5vw, 1.5rem);
            font-weight: 900;
            letter-spacing: .42em;
            text-indent: .42em;
            text-shadow: 0 2px 3px #000;
        }

        /* =========================================================
           MAIN SCOREBOARD
           ========================================================= */

        .timer-card {
            position: relative;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px 50px 20px;

            background:
                radial-gradient(circle at 50% 45%, rgba(255,255,255,.025), transparent 42%),
                linear-gradient(145deg, #050505, #010203 60%, #060b11);

            border: 5px solid var(--gold);
            clip-path: polygon(
                0 25px,
                25px 0,
                calc(100% - 25px) 0,
                100% 25px,
                100% calc(100% - 25px),
                calc(100% - 25px) 100%,
                25px 100%,
                0 calc(100% - 25px)
            );

            box-shadow:
                0 0 0 2px rgba(0,0,0,.7) inset,
                0 0 32px rgba(0,0,0,.65),
                0 0 25px rgba(245,196,0,.14);
        }

        .timer-card::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(255,255,255,.04);
            clip-path: inherit;
            pointer-events: none;
        }

        /* subtle diagonal texture inside scoreboard */
        .timer-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .5;
            background:
                repeating-linear-gradient(
                    -35deg,
                    transparent 0 26px,
                    rgba(255,255,255,.014) 27px 29px,
                    transparent 30px 60px
                );
        }

        .period-label {
            position: relative;
            z-index: 2;
            margin-bottom: -4px;
            color: var(--gold-bright);
            font-size: clamp(1.4rem, 2.4vw, 2.6rem);
            line-height: 1;
            font-weight: 950;
            font-style: italic;
            letter-spacing: .12em;
            text-transform: uppercase;
            text-shadow: 2px 3px 0 #000;
        }

        /*
          periodNumber is intentionally kept exactly the same ID.
          The word "OF" is added as a visual element without changing
          the JavaScript contract.
        */
        .period-row {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: clamp(14px, 2vw, 34px);
            margin-top: 3px;
        }

        .period-number {
            color: var(--gold-bright);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(4.2rem, 7vw, 7rem);
            line-height: .8;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .02em;
            text-shadow:
                3px 4px 0 #8b6900,
                0 0 12px rgba(255,210,26,.16);
        }

        .period-of {
            color: var(--white);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(2rem, 3.6vw, 3.8rem);
            line-height: 1;
            font-weight: 600;
            letter-spacing: .03em;
        }

        .period-total {
            color: var(--gold-bright);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(4.2rem, 7vw, 7rem);
            line-height: .8;
            font-weight: 700;
            font-style: italic;
            text-shadow:
                3px 4px 0 #8b6900,
                0 0 12px rgba(255,210,26,.16);
        }

        /* Main time */
        .timer {
            position: relative;
            z-index: 2;
            margin: clamp(4px, 1vh, 12px) 0 0;
            color: var(--white);
            font-family: "Teko", Impact, "Arial Narrow", sans-serif;
            font-size: clamp(8rem, 17vw, 17rem);
            line-height: .68;
            font-weight: 600;
            font-style: normal;
            letter-spacing: .025em;
            font-variant-numeric: tabular-nums lining-nums;
            text-shadow:
                0 5px 0 rgba(0,0,0,.8),
                0 0 22px rgba(255,255,255,.07);
        }

        .next-period {
            position: relative;
            z-index: 2;
            width: min(85%, 950px);
            margin-top: clamp(8px, 2vh, 18px);
            padding-top: 11px;
            border-top: 3px solid rgba(255,255,255,.1);
            color: #e6e6e6;
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-size: clamp(.8rem, 1.25vw, 1.35rem);
            font-weight: 700;
            font-style: italic;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .next-period::before,
        .next-period::after {
            content: "";
            display: inline-block;
            width: 25%;
            max-width: 300px;
            height: 3px;
            margin: 0 18px 4px 0;
            background: var(--gold);
        }

        .next-period::after {
            margin: 0 0 4px 18px;
        }

        .next-period span {
            color: var(--gold-bright);
            font-size: 1.05em;
            text-shadow: 0 0 12px rgba(255,210,26,.25);
        }

        /* Keep status available, but style it like a small scoreboard state */
        .status {
            position: absolute;
            z-index: 3;
            right: 32px;
            bottom: 17px;
            font-size: .8rem;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .72;
        }

        .status .running {
            color: #69d47b;
        }

        .status .paused {
            color: #ffc84a;
        }

        /* =========================================================
           BOTTOM MOTTO
           ========================================================= */

        .motto {
            position: relative;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 8px 80px 3px;
            color: var(--white);
            font-size: clamp(1rem, 2vw, 2rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: .07em;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 rgba(0,0,0,.6);
            text-align: center;
        }

        .motto::before,
        .motto::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 15%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold));
            transform: translateY(-50%) skewX(-25deg);
        }

        .motto::before {
            left: 0;
        }

        .motto::after {
            right: 0;
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .motto small {
            color: var(--gold-bright);
            font-size: .72em;
            letter-spacing: .12em;
            white-space: nowrap;
        }


        /* =========================================================
           PAINT-BRUSH GOLD STREAKS
           ========================================================= */

        .paint-streak {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(8deg,
                    transparent 0 8%,
                    rgba(245,196,0,.96) 9% 27%,
                    rgba(255,210,26,.72) 28% 43%,
                    transparent 44% 100%);
            filter: drop-shadow(0 0 7px rgba(245,196,0,.12));
            opacity: .9;
        }

        .streak-left-top {
            left: -70px;
            top: 120px;
            width: 390px;
            height: 150px;
            transform: rotate(-18deg);
            clip-path: polygon(
                0 25%, 14% 19%, 35% 32%, 55% 12%, 78% 28%,
                100% 5%, 92% 42%, 70% 39%, 51% 64%, 30% 48%,
                11% 71%, 0 60%
            );
        }

        .streak-left-bottom {
            left: -100px;
            bottom: 115px;
            width: 430px;
            height: 135px;
            transform: rotate(12deg);
            clip-path: polygon(
                0 48%, 18% 35%, 39% 52%, 60% 20%, 81% 41%,
                100% 12%, 94% 63%, 72% 54%, 53% 82%, 31% 61%,
                12% 88%, 0 76%
            );
        }

        .streak-right-top {
            right: -90px;
            top: 105px;
            width: 430px;
            height: 150px;
            transform: scaleX(-1) rotate(-14deg);
            clip-path: polygon(
                0 25%, 14% 19%, 35% 32%, 55% 12%, 78% 28%,
                100% 5%, 92% 42%, 70% 39%, 51% 64%, 30% 48%,
                11% 71%, 0 60%
            );
        }

        .streak-right-bottom {
            right: -110px;
            bottom: 120px;
            width: 450px;
            height: 140px;
            transform: scaleX(-1) rotate(11deg);
            clip-path: polygon(
                0 48%, 18% 35%, 39% 52%, 60% 20%, 81% 41%,
                100% 12%, 94% 63%, 72% 54%, 53% 82%, 31% 61%,
                12% 88%, 0 76%
            );
        }

        .streak-thin {
            height: 28px;
            width: 260px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--gold) 15% 78%,
                transparent
            );
            opacity: .65;
            clip-path: polygon(0 45%, 18% 27%, 75% 35%, 100% 8%, 91% 70%, 30% 64%);
        }

        .streak-thin-left {
            left: -30px;
            top: 360px;
            transform: rotate(-25deg);
        }

        .streak-thin-right {
            right: -30px;
            top: 360px;
            transform: scaleX(-1) rotate(-25deg);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 1100px) {
            .display-shell {
                padding-left: 22px;
                padding-right: 22px;
            }

            .header {
                grid-template-columns: 190px 1fr 130px;
            }

            .logo-left img {
                width: 175px;
            }

            .logo-right img {
                width: 105px;
            }

            .timer-card {
                padding-left: 25px;
                padding-right: 25px;
            }

            .next-period::before,
            .next-period::after {
                width: 18%;
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
            }

            .display-shell {
                min-height: 100vh;
                height: auto;
                padding: 14px 12px;
                grid-template-rows: auto auto auto;
            }

            .header {
                grid-template-columns: 1fr;
                gap: 8px;
                min-height: 0;
                text-align: center;
                padding-bottom: 14px;
            }

            .header::after {
                left: 5%;
                right: 5%;
            }

            .logo-left,
            .logo-right {
                justify-content: center;
            }

            .logo-left img {
                width: 125px;
                max-height: 65px;
            }

            .logo-right img {
                width: 80px;
                max-height: 45px;
            }

            .header-center {
                order: -1;
            }

            .header-center h1 {
            color: var(--white);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(1.65rem, 3vw, 3.2rem);
            line-height: .85;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .12em;
            text-transform: uppercase;
            text-shadow:
                3px 3px 0 rgba(0,0,0,.5),
                0 0 18px rgba(255,255,255,.08);
            white-space: nowrap;
        }

        @media (max-height: 700px) and (min-width: 761px) {
            .display-shell {
                padding-top: 10px;
                padding-bottom: 8px;
                gap: 6px;
            }

            .header {
                min-height: 78px;
            }

            .logo-left img {
                width: 145px;
                max-height: 70px;
            }

            .logo-right img {
                width: 95px;
                max-height: 50px;
            }

            .header-center h1 {
            color: var(--white);
            font-family: "Teko", Impact, sans-serif;
            font-size: clamp(1.65rem, 3vw, 3.2rem);
            line-height: .85;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .12em;
            text-transform: uppercase;
            text-shadow:
                3px 3px 0 rgba(0,0,0,.5),
                0 0 18px rgba(255,255,255,.08);
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <!-- Gold brush/paint streaks from the reference design -->
    <div class="paint-streak streak-left-top"></div>
    <div class="paint-streak streak-left-bottom"></div>
    <div class="paint-streak streak-right-top"></div>
    <div class="paint-streak streak-right-bottom"></div>
    <div class="paint-streak streak-thin streak-thin-left"></div>
    <div class="paint-streak streak-thin streak-thin-right"></div>

    <div class="page">
        <div class="display-shell">

            <!-- =====================================================
                 HEADER
                 ===================================================== -->
            <header class="header">
                <div class="logo-left">
                    <img
                        src="{{ url_for('static', filename='wise-logo.png') }}"
                        alt="Dr. Henry A. Wise Jr. High School"
                    />
                </div>

                <div class="header-center">
                    <div class="school-line"></div>
                    <h1>Wise Pumas Football</h1>
                    <span class="practice-title">Practice Clock</span>
                    <div class="subtitle">Dr. Henry A. Wise Jr. High School</div>
                </div>

                <div class="logo-right">
                    <img
                        src="{{ url_for('static', filename='adidas-logo.png') }}"
                        alt="Adidas"
                    />
                </div>

                <div class="pgtao">P.G.T.A.O</div>
            </header>

            <!-- =====================================================
                 TIMER / SCOREBOARD

                 DO NOT CHANGE THESE IDs:
                 periodNumber
                 timerDisplay
                 nextPeriodTime
                 statusIndicator
                 ===================================================== -->
            <main class="timer-card">
                <div class="period-label">Period</div>

                <div class="period-row">
                    <div class="period-number" id="periodNumber">1</div>
                    <span class="period-of">OF</span>
                    <span class="period-total">30</span>
                </div>

                <div class="timer" id="timerDisplay">00:00</div>

                <div class="next-period">
                    Next Period Starts In
                    <span id="nextPeriodTime">00:00</span>
                </div>

                <div class="status" id="statusIndicator">
                    <span class="paused">⏸ PAUSED</span>
                </div>
            </main>

            <!-- =====================================================
                 MOTTO
                 ===================================================== -->
            <footer class="motto">
                <span>Champions Are Made In The Off Season</span>
                <small>P.U.M.A Pride</small>
            </footer>
        </div>
    </div>

    <script>
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;

            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            if (h > 0) {
                return `${pad(h)}:${pad(m)}:${pad(s)}`;
            }

            return `${pad(m)}:${pad(s)}`;
        }

        function updateDisplay() {
            fetch('/state?_=' + Date.now())
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Network response was not ok');
                    }

                    return res.json();
                })
                .then(data => {
                    if (data.error) {
                        document.getElementById('timerDisplay').textContent = '--:--';
                        document.getElementById('periodNumber').textContent = '?';
                        document.getElementById('nextPeriodTime').textContent = '--:--';

                        document.getElementById('statusIndicator').innerHTML =
                            '<span class="paused">⏸ OFFLINE</span>';

                        return;
                    }

                    const idx = data.current_index || 0;
                    const remaining = data.remaining || 0;
                    const running = data.running || false;

                    document.getElementById('periodNumber').textContent = idx + 1;
                    document.getElementById('timerDisplay').textContent = formatTime(remaining);
                    document.getElementById('nextPeriodTime').textContent = formatTime(remaining);

                    const statusEl = document.getElementById('statusIndicator');

                    if (running) {
                        statusEl.innerHTML =
                            '<span class="running">▶ RUNNING</span>';
                    } else {
                        statusEl.innerHTML =
                            '<span class="paused">⏸ PAUSED</span>';
                    }
                })
                .catch((error) => {
                    console.error('Error fetching state:', error);

                    document.getElementById('timerDisplay').textContent = 'ERR';
                    document.getElementById('periodNumber').textContent = '?';
                    document.getElementById('nextPeriodTime').textContent = '--:--';

                    document.getElementById('statusIndicator').innerHTML =
                        '<span class="paused">⏸ OFFLINE</span>';
                });
        }

        updateDisplay();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
