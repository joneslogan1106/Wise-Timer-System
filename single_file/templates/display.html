<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wise Pumas Football Practice Clock</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicion.ico') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }

        :root {
            --navy: #03142d;
            --navy-2: #082b59;
            --gold: #f4c400;
            --gold-2: #ffd51a;
            --white: #f7f8fb;
            --black: #020304;
        }

        body {
            overflow: hidden;
            color: var(--white);
            background:
                radial-gradient(circle at 50% 45%, rgba(18, 73, 139, .28), transparent 44%),
                linear-gradient(135deg, #020d20 0%, #082a56 47%, #020d20 100%);
            font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        }

        .background-texture {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .42;
            background:
                repeating-linear-gradient(115deg,
                    transparent 0 80px,
                    rgba(255,255,255,.018) 81px 83px,
                    transparent 84px 160px),
                repeating-linear-gradient(25deg,
                    transparent 0 115px,
                    rgba(0,0,0,.16) 116px 119px,
                    transparent 120px 230px);
        }

        .top-stripe {
            position: fixed;
            z-index: 20;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg,
                var(--gold) 0 22%,
                #fff 22% 27%,
                #0a56a8 27% 73%,
                #fff 73% 78%,
                var(--gold) 78% 100%);
        }

        .paint {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            background: var(--gold);
            filter: drop-shadow(0 0 5px rgba(244,196,0,.18));
            opacity: .9;
        }

        .paint-left-top {
            left: -90px; top: 135px; width: 390px; height: 120px;
            transform: rotate(-17deg);
            clip-path: polygon(0 28%, 11% 19%, 25% 35%, 42% 14%, 57% 28%, 76% 8%, 100% 22%, 89% 43%, 70% 38%, 53% 67%, 36% 49%, 18% 74%, 0 62%);
        }
        .paint-left-bottom {
            left: -100px; bottom: 115px; width: 430px; height: 125px;
            transform: rotate(12deg);
            clip-path: polygon(0 46%, 17% 34%, 35% 52%, 54% 18%, 71% 40%, 100% 8%, 92% 58%, 74% 52%, 53% 82%, 31% 61%, 12% 89%, 0 76%);
        }
        .paint-right-top {
            right: -90px; top: 130px; width: 400px; height: 125px;
            transform: scaleX(-1) rotate(-17deg);
            clip-path: polygon(0 28%, 11% 19%, 25% 35%, 42% 14%, 57% 28%, 76% 8%, 100% 22%, 89% 43%, 70% 38%, 53% 67%, 36% 49%, 18% 74%, 0 62%);
        }
        .paint-right-bottom {
            right: -105px; bottom: 115px; width: 440px; height: 130px;
            transform: scaleX(-1) rotate(12deg);
            clip-path: polygon(0 46%, 17% 34%, 35% 52%, 54% 18%, 71% 40%, 100% 8%, 92% 58%, 74% 52%, 53% 82%, 31% 61%, 12% 89%, 0 76%);
        }
        .paint-small-left {
            left: -30px; top: 370px; width: 270px; height: 28px;
            transform: rotate(-23deg);
            clip-path: polygon(0 45%, 15% 27%, 72% 35%, 100% 8%, 90% 69%, 30% 64%);
        }
        .paint-small-right {
            right: -30px; top: 370px; width: 270px; height: 28px;
            transform: scaleX(-1) rotate(-23deg);
            clip-path: polygon(0 45%, 15% 27%, 72% 35%, 100% 8%, 90% 69%, 30% 64%);
        }

        /* ---------- PAGE / GRID ---------- */
        .page {
            position: relative;
            z-index: 5;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .display-shell {
            width: min(1536px, 100vw);
            height: 100%;
            padding: 6px 38px 12px;          /* reduced top padding to shift everything up */
            display: grid;
            grid-template-rows: 125px 26px minmax(0, 1fr) 56px;
            gap: 4px;
        }

        /* ---------- HEADER ---------- */
        .header {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid var(--gold);
            overflow: visible;
        }

        .logo-left,
        .logo-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
        }
        .logo-left { left: 0; justify-content: flex-start; }
        .logo-right { right: 0; justify-content: flex-end; }

        .logo-left img {
            width: 190px;
            max-height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,.65));
        }

        .logo-right img {
            width: 120px;
            max-height: 68px;
            object-fit: contain;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,.65));
        }

        .header-center {
            width: min(760px, 58vw);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .school-line {
            width: 100%;
            height: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1px;
        }
        .school-line::before,
        .school-line::after {
            content: "";
            width: 60px;
            height: 4px;
            background: var(--gold);
            transform: skewX(-25deg);
        }

        .header-center h1 {
            margin: 0;
            color: var(--white);
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-size: clamp(0.9rem, 1.4vw, 1.4rem);
            line-height: 1;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .2em;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 2px 3px 0 rgba(0,0,0,.55);
        }

        .practice-title {
            font-family: "Anton", "Teko", Impact, sans-serif;
            font-size: clamp(2.6rem, 5vw, 5rem);
            font-weight: 400;
            letter-spacing: .045em;
            color: var(--gold-2);
            text-shadow: 3px 4px 0 #806000, 0 0 18px rgba(255,210,26,.15);
            text-transform: uppercase;
            white-space: nowrap;
            line-height: 1;
            margin-top: 1px;
        }

        .school-name {
            width: 100%;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #edf1f7;
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-size: clamp(0.5rem, 0.7vw, 0.75rem);
            font-weight: 600;
            letter-spacing: .25em;
            line-height: 1;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            text-shadow: 2px 2px 3px #000;
        }

        .pgtao {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            z-index: 10;
            min-width: 180px;
            padding: 3px 24px 4px;
            color: #fff;
            background: linear-gradient(180deg, #11549f, #06306a);
            border: 2px solid var(--gold);
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
            font-family: "Oswald", sans-serif;
            font-size: clamp(0.6rem, 0.9vw, 0.85rem);
            font-weight: 700;
            letter-spacing: .34em;
            text-indent: .34em;
            text-align: center;
            text-shadow: 0 2px 3px #000;
            margin-bottom: -2px;
        }

        /* ---------- TIMER CARD ---------- */
        .timer-card {
            position: relative;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;   /* shift content to top of card */
            text-align: center;
            padding: 4px 30px 28px;        /* reduced top padding to move Period label up */
            background: linear-gradient(145deg, #060606, #010203 58%, #080b0f);
            border: 5px solid var(--gold);
            clip-path: polygon(0 25px, 25px 0, calc(100% - 25px) 0, 100% 25px, 100% calc(100% - 25px), calc(100% - 25px) 100%, 25px 100%, 0 calc(100% - 25px));
            box-shadow: 0 0 0 2px rgba(0,0,0,.7) inset, 0 0 30px rgba(0,0,0,.7), 0 0 24px rgba(244,196,0,.12);
        }

        .timer-card::before {
            content: "";
            position: absolute;
            inset: 10px;
            pointer-events: none;
            border: 2px solid rgba(255,255,255,.035);
        }
        .timer-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .42;
            background: repeating-linear-gradient(-35deg, transparent 0 28px, rgba(255,255,255,.012) 29px 31px, transparent 32px 62px);
        }

        .period-label {
            position: relative;
            z-index: 2;
            margin: 0 0 1px;
            color: var(--gold-2);
            font-family: "Oswald", sans-serif;
            font-size: clamp(0.9rem, 1.5vw, 1.6rem);
            line-height: 1;
            font-weight: 700;
            font-style: italic;
            letter-spacing: .18em;
            text-transform: uppercase;
            text-shadow: 2px 3px 0 #000;
        }

        .period-row {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: clamp(10px, 1.4vw, 24px);
            height: clamp(38px, 4.5vw, 65px);
            margin: 0;
        }

        .period-number,
        .period-total {
            color: var(--gold-2);
            font-family: "Anton", "Teko", Impact, sans-serif;
            font-size: clamp(2.8rem, 5vw, 5rem);
            line-height: .8;
            font-weight: 400;
            font-style: italic;
            letter-spacing: .015em;
            text-shadow: 3px 4px 0 #806000, 0 0 12px rgba(255,210,26,.15);
        }

        .period-of {
            color: #fff;
            font-family: "Oswald", sans-serif;
            font-size: clamp(1.4rem, 2.4vw, 2.5rem);
            line-height: 1;
            font-weight: 600;
            letter-spacing: .04em;
        }

        .timer {
            position: relative;
            z-index: 2;
            margin: clamp(0px, 0.2vh, 2px) 0 0;
            color: #fff;
            font-family: "Anton", "Teko", Impact, sans-serif;
            font-size: clamp(5.5rem, 13vw, 12rem);
            font-weight: 400;
            line-height: .72;
            letter-spacing: .035em;
            font-variant-numeric: tabular-nums lining-nums;
            white-space: nowrap;
            text-shadow: 0 5px 0 rgba(0,0,0,.82), 0 0 20px rgba(255,255,255,.07);
        }

        .next-period {
            position: relative;
            z-index: 2;
            width: min(900px, 82%);
            margin-top: clamp(2px, 0.6vh, 8px);
            padding-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #e9e9e9;
            font-family: "Oswald", sans-serif;
            font-size: clamp(0.6rem, 0.9vw, 0.95rem);
            font-weight: 600;
            font-style: italic;
            letter-spacing: .13em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .next-period::before,
        .next-period::after {
            content: "";
            flex: 1 1 auto;
            height: 3px;
            min-width: 24px;
            background: var(--gold);
        }
        .next-period span {
            color: var(--gold-2);
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255,210,26,.25);
        }

        .status {
            position: absolute;
            z-index: 3;
            right: 22px;
            bottom: 10px;
            font-family: "Oswald", sans-serif;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .8;
        }
        .status .running { color: #70d981; }
        .status .paused { color: #ffc940; }

        /* ---------- FOOTER ---------- */
        .motto {
            position: relative;
            width: 100%;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 0 70px;
            color: #fff;
            font-family: "Oswald", sans-serif;
            font-size: clamp(.85rem, 1.55vw, 1.55rem);
            font-weight: 700;
            font-style: italic;
            letter-spacing: .08em;
            line-height: 1;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 3px 3px 0 rgba(0,0,0,.65);
        }
        .motto small {
            color: var(--gold-2);
            font-size: .72em;
            letter-spacing: .12em;
            white-space: nowrap;
        }
        .motto::before,
        .motto::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 15%;
            height: 4px;
            transform: translateY(-50%) skewX(-25deg);
            background: linear-gradient(90deg, transparent, var(--gold));
        }
        .motto::before { left: 0; }
        .motto::after { right: 0; transform: translateY(-50%) skewX(25deg); background: linear-gradient(90deg, var(--gold), transparent); }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 900px) {
            .display-shell { padding-left: 18px; padding-right: 18px; padding-top: 4px; }
            .logo-left img { width: 140px; max-height: 72px; }
            .logo-right img { width: 90px; max-height: 50px; }
            .header-center { width: 62vw; }
            .timer { font-size: clamp(5rem, 13vw, 9rem); }
        }

        @media (max-width: 700px) {
            body { overflow: auto; }
            .display-shell {
                min-height: 100vh;
                height: auto;
                padding: 6px 10px 12px;
                grid-template-rows: 110px 22px minmax(400px, 1fr) 56px;
                gap: 4px;
            }
            .header { height: 100%; }
            .logo-left { left: 2px; top: 20%; }
            .logo-right { right: 2px; top: 20%; }
            .logo-left img { width: 60px; max-height: 45px; }
            .logo-right img { width: 50px; max-height: 34px; }
            .header-center { width: 100%; padding: 0 5px; }
            .header-center h1 { font-size: 0.8rem; letter-spacing: .09em; }
            .practice-title { font-size: clamp(1.6rem, 7vw, 2.6rem); }
            .school-line { display: none; }
            .school-name { font-size: 0.45rem; letter-spacing: .15em; height: 22px; }
            .pgtao { min-width: 120px; bottom: 0; padding: 2px 14px 3px; font-size: 0.5rem; margin-bottom: -2px; }
            .timer-card { padding: 2px 8px 20px; justify-content: flex-start; }
            .period-row { gap: 6px; height: clamp(32px, 5vw, 48px); }
            .period-number, .period-total { font-size: 2.6rem; }
            .period-of { font-size: 1.3rem; }
            .timer { font-size: clamp(3.8rem, 18vw, 6.5rem); }
            .next-period { width: 94%; font-size: .5rem; gap: 6px; }
            .status { position: static; margin-top: 4px; }
            .motto { height: 56px; padding: 0 8px; flex-direction: column; gap: 2px; font-size: .65rem; }
            .motto::before, .motto::after { display: none; }
            .paint { opacity: .45; }
        }

        @media (max-height: 720px) and (min-width: 701px) {
            .display-shell { padding-top: 4px; padding-bottom: 6px; grid-template-rows: 100px 22px minmax(0,1fr) 40px; gap: 3px; }
            .header { height: 100%; }
            .logo-left img { width: 130px; max-height: 62px; }
            .logo-right img { width: 80px; max-height: 44px; }
            .header-center h1 { font-size: 1.1rem; }
            .practice-title { font-size: clamp(2rem, 4vw, 3.4rem); }
            .school-name { height: 22px; font-size: 0.55rem; }
            .pgtao { padding: 2px 18px 3px; font-size: 0.6rem; min-width: 150px; }
            .timer-card { padding-top: 2px; padding-bottom: 16px; justify-content: flex-start; }
            .period-label { font-size: 0.9rem; }
            .period-row { height: 38px; }
            .period-number, .period-total { font-size: 2.8rem; }
            .period-of { font-size: 1.4rem; }
            .timer { font-size: clamp(4.5rem, 11vw, 7.5rem); }
            .next-period { margin-top: 2px; padding-top: 2px; font-size: .6rem; }
            .motto { height: 40px; font-size: .75rem; }
        }
    </style>
</head>
<body>
    <div class="background-texture"></div>
    <div class="top-stripe"></div>

    <div class="paint paint-left-top"></div>
    <div class="paint paint-left-bottom"></div>
    <div class="paint paint-right-top"></div>
    <div class="paint paint-right-bottom"></div>
    <div class="paint paint-small-left"></div>
    <div class="paint paint-small-right"></div>

    <div class="page">
        <div class="display-shell">
            <header class="header">
                <div class="logo-left">
                    <img src="{{ url_for('static', filename='wise-logo.png') }}" alt="Wise Pumas">
                </div>

                <div class="header-center">
                    <div class="school-line"></div>
                    <h1>Wise Pumas Football</h1>
                    <span class="practice-title">Practice Clock</span>
                </div>

                <div class="logo-right">
                    <img src="{{ url_for('static', filename='adidas-logo.png') }}" alt="Adidas">
                </div>

                <div class="pgtao">P.G.T.A.O</div>
            </header>

            <div class="school-name">Dr. Henry A. Wise Jr. High School</div>

            <main class="timer-card">
                <div class="period-label">Period</div>

                <div class="period-row">
                    <div class="period-number" id="periodNumber">1</div>
                    <span class="period-of">OF</span>
                    <span class="period-total" id="totalPeriods">4</span>
                </div>

                <div class="timer" id="timerDisplay">00:00</div>

                <div class="next-period">
                    <span>Next Period Starts In</span>
                    <span id="nextPeriodTime">00:00</span>
                </div>

                <div class="status" id="statusIndicator">
                    <span class="paused">⏸ PAUSED</span>
                </div>
            </main>

            <footer class="motto">
                <span>Champions Are Made In The Off Season</span>
                <small>P.U.M.A Pride</small>
            </footer>
        </div>
    </div>

    <script>
        function pad(n) { return String(n).padStart(2, '0'); }

        function formatTime(seconds) {
            seconds = Math.max(0, Number(seconds) || 0);
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        }

        function updateDisplay() {
            fetch('/state?_=' + Date.now(), { cache: 'no-store' })
                .then(res => {
                    if (!res.ok) throw new Error('State request failed');
                    return res.json();
                })
                .then(data => {
                    if (data.error) throw new Error(data.error);

                    const idx = Number.isFinite(data.current_index) ? data.current_index : 0;
                    const remaining = Number(data.remaining) || 0;
                    const running = Boolean(data.running);
                    const total = Array.isArray(data.settings)
                        ? data.settings.length
                        : (Number(data.total_periods) || 0);

                    document.getElementById('periodNumber').textContent = idx + 1;
                    document.getElementById('totalPeriods').textContent = total;
                    document.getElementById('timerDisplay').textContent = formatTime(remaining);
                    document.getElementById('nextPeriodTime').textContent = formatTime(remaining);

                    const status = document.getElementById('statusIndicator');
                    status.innerHTML = running
                        ? '<span class="running">▶ RUNNING</span>'
                        : '<span class="paused">⏸ PAUSED</span>';
                })
                .catch(error => {
                    console.error('Display state error:', error);
                    document.getElementById('periodNumber').textContent = '?';
                    document.getElementById('totalPeriods').textContent = '?';
                    document.getElementById('timerDisplay').textContent = '--:--';
                    document.getElementById('nextPeriodTime').textContent = '--:--';
                    document.getElementById('statusIndicator').innerHTML = '<span class="paused">⏸ OFFLINE</span>';
                });
        }

        updateDisplay();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
